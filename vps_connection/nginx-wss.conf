# nginx-wss.conf — SubwayThotsHotel world WebSocket TLS terminator
#
# Use this instead of Caddy if you prefer nginx (Linux VPS, or nginx for Windows).
# Drop the server{} block below into your nginx sites (e.g. /etc/nginx/sites-enabled/
# on Linux, or conf.d/ on Windows). nginx does NOT auto-renew certs — use certbot
# (Linux) or win-acme (Windows) for Let's Encrypt, then `nginx -s reload`.
#
# Requirements:
#   - DNS A record:  world.YOURDOMAIN.com  ->  147.189.172.104
#   - Firewall: TCP 80 (cert challenge) + TCP 443 (wss://) open
#   - World host (Host.py) running on 127.0.0.1:7076 (plaintext)
#   - Cert files present at the paths below (fullchain + privkey)

server {
    listen 443 ssl;
    server_name world.YOURDOMAIN.com;

    ssl_certificate     /etc/ssl/subwaythots/world.YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/subwaythots/world.YOURDOMAIN.com/privkey.pem;

    # WebSocket upgrade — required for /ws/sth-city-01
    location / {
        proxy_pass http://127.0.0.1:7076;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep idle sockets alive long enough for the game snapshot loop
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Redirect HTTP -> HTTPS (also serves the ACME http-01 challenge if your cert
# tool uses port 80). Only needed if port 80 is open and you want clean redirects.
server {
    listen 80;
    server_name world.YOURDOMAIN.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
